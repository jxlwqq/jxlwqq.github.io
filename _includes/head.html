<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">

  <title>
    {% if page.title == "Home" %}
      {{ site.title }}{% if site.tagline %} &middot; {{ site.tagline }}{% endif %}
    {% else %}
      {{ page.title }} &middot; {{ site.title }}
    {% endif %}
  </title>

  <link rel="stylesheet" href="{{ 'styles.css' | relative_url }}">
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{{ '/assets/apple-touch-icon-precomposed.png' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/assets/favicon.ico' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ 'feed.xml' | relative_url }}">

  {% seo title=false %}

  <!-- Mermaid JS for diagrams -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    // Posts may carry light classDef fills from light-theme diagrams; pick
    // label color per node from the actual fill luminance so light nodes get
    // dark text and dark nodes keep light text.
    function fixMermaidContrast() {
      function luminance(color) {
        var r, g, b;
        var hex = /#([0-9a-f]{3,8})\s*$/i.exec(color);
        if (hex) {
          var h = hex[1];
          if (h.length <= 4) {
            r = parseInt(h[0] + h[0], 16); g = parseInt(h[1] + h[1], 16); b = parseInt(h[2] + h[2], 16);
          } else {
            r = parseInt(h.slice(0, 2), 16); g = parseInt(h.slice(2, 4), 16); b = parseInt(h.slice(4, 6), 16);
          }
        } else {
          var rgb = /rgba?\(([^)]+)\)/.exec(color);
          if (!rgb) return 0;
          var parts = rgb[1].split(/[,\s\/]+/).filter(Boolean).map(parseFloat);
          r = parts[0]; g = parts[1]; b = parts[2];
        }
        if ([r, g, b].some(function(v) { return isNaN(v); })) return 0;
        return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      }
      document.querySelectorAll('.mermaid svg').forEach(function(svg) {
        svg.querySelectorAll('g.node').forEach(function(node) {
          var shape = node.querySelector('rect, polygon, path, circle, ellipse');
          var lum = 0;
          if (shape) {
            lum = luminance(shape.getAttribute('fill') || getComputedStyle(shape).fill || '');
          }
          var color = lum > 0.55 ? '#1f2328' : '#e5e5e5';
          node.querySelectorAll('.nodeLabel, .label, span, div, p, text').forEach(function(el) {
            el.style.color = color;
            if (el.tagName.toLowerCase() === 'text') {
              el.setAttribute('fill', color);
              el.style.fill = color;
            }
          });
        });
      });
    }
    document.addEventListener("DOMContentLoaded", function() {
      mermaid.initialize({
        startOnLoad: false,
        theme: 'dark',
        themeVariables: {
          background: '#000000',
          primaryColor: '#171717',
          primaryTextColor: '#e5e5e5',
          primaryBorderColor: '#404040',
          lineColor: '#737373',
          textColor: '#e5e5e5',
          mainBkg: '#171717',
          nodeBorder: '#525252'
        }
      });
      // Convert ```mermaid code blocks to mermaid divs
      document.querySelectorAll('pre code.language-mermaid').forEach(function(codeBlock) {
        var pre = codeBlock.parentNode;
        var div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = codeBlock.textContent;
        pre.parentNode.replaceChild(div, pre);
      });
      var run = mermaid.run();
      if (run && typeof run.then === 'function') {
        run.then(fixMermaidContrast).catch(fixMermaidContrast);
      } else {
        setTimeout(fixMermaidContrast, 1200);
      }
    });
  </script>

  <!-- MathJax for LaTeX formulas -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
</head>
